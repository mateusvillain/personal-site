# Sites recomendados, listados em /resources/ e /pt/resources/.
#
# Cada entrada comeca com uma chave unica (so letras, numeros e hifens). A
# pagina lista os sites em ordem alfabetica pelo `name`, entao a ordem deste
# arquivo nao importa:
#
#   chave-do-site:
#     name: Nome exibido
#     url: https://endereco-completo.com
#     category: components
#     icon: /img/resources/arquivo.png   # opcional
#
# `category` define em qual filtro o site aparece. Use uma das chaves de
# `resourceCategories` em `src/i18n/resources.ts` (hoje: components,
# inspiration, learning); o nome exibido de cada uma fica no mesmo arquivo.
# Para criar uma categoria, adicione a chave la e o nome nos dois idiomas.
#
# `icon` e um caminho dentro de `public/` (ex.: salve o arquivo em
# `public/img/resources/` e use `/img/resources/arquivo.png`). Sem icone, a
# pagina mostra a inicial do nome. O endereco exibido na coluna "Site" sai
# da propria `url`, sem `https://` e `www.`.

